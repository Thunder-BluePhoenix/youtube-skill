name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundles
        run: |
          python scripts/build_bundles.py
          cd dist/chat && zip -q ../youtube-chat-bundle.zip *.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/youtube-skill.zip dist/youtube-chat-bundle.zip --generate-notes
